id: satisfies-expr
language: typescript
# Matches: expr satisfies SomeType  (TypeScript 4.9+ satisfies operator)
# tree-sitter-typescript node: satisfies_expression
# Ion treatment: drop the satisfies operator — emit only the inner expression.
# satisfies is purely a compile-time constraint with no runtime effect.
match:
  nodeType: satisfies_expression
  children:
    - pattern:
        capture: $EXPR
    - pattern:
        capture: $TYPE
conditions:
  - kind: has-children
    count: 2
emit:
  kind: Var
  name:
    metavar: $EXPR
    field: text
  symbolId:
    metavar: $EXPR
    field: text
  type:
    kind: Never
