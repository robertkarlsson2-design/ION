id: generic-arrow-fn
language: typescript
# Matches: const identity = <T>(x: T): T => x
# tree-sitter-typescript: arrow_function with type_parameters child (the <T> part)
match:
  nodeType: arrow_function
  children:
    - pattern:
        nodeType: type_parameters
        capture: $TYPE_PARAMS
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: type_annotation
        capture: $RETURN_TYPE
    - pattern:
        capture: $BODY
conditions:
  - kind: has-child
    nodeType: type_parameters
emit:
  kind: Abs
  params: []
  captures: []
  body:
    recurse: $BODY
  type:
    kind: Never
