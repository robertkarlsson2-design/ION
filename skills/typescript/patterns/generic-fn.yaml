id: generic-fn
language: typescript
# Matches: function id<T>(x: T): T { return x }
# tree-sitter-typescript node: function_declaration with type_parameters child
# Children: identifier (name) + type_parameters + formal_parameters + type_annotation (return) + statement_block
match:
  nodeType: function_declaration
  children:
    - pattern:
        nodeType: identifier
        capture: $NAME
    - pattern:
        nodeType: type_parameters
        capture: $TYPE_PARAMS
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: type_annotation
        capture: $RETURN_TYPE
    - pattern:
        nodeType: statement_block
        capture: $BODY
conditions:
  - kind: has-child
    nodeType: type_parameters
emit:
  kind: Let
  name:
    metavar: $NAME
    field: text
  symbolId:
    metavar: $NAME
    field: text
  bindingType:
    kind: Never
  value:
    kind: Abs
    params: []
    captures: []
    body:
      recurse: $BODY
    type:
      kind: Never
  body:
    kind: Literal
    value:
      kind: Int
      value: 0
    type:
      kind: Int
