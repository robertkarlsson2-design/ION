id: typed-arrow-fn
language: typescript
# Matches: (x: number, y: string): boolean => expr
# tree-sitter-typescript node: arrow_function with type_annotation on each
# required_parameter child and a return type_annotation after the formal_parameters.
match:
  nodeType: arrow_function
  children:
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: type_annotation
        capture: $RETURN_TYPE
    - pattern:
        capture: $BODY
conditions:
  - kind: has-child
    nodeType: type_annotation
emit:
  kind: Abs
  params: []
  captures: []
  body:
    kind: Var
    name:
      metavar: $BODY
      field: text
    symbolId:
      metavar: $BODY
      field: text
    type:
      kind: Never
  type:
    kind: Never
