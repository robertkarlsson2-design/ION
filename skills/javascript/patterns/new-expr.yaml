id: new-expr
language: javascript
match:
  nodeType: new_expression
  children:
    - pattern:
        nodeType: identifier
        capture: $CTOR
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $$$ARGS
            isSequence: true
emit:
  kind: OopNew
  ctorSymbolId:
    metavar: $CTOR
    field: text
  args:
    - kind: Var
      name:
        metavar: $CTOR
        field: text
      symbolId:
        metavar: $CTOR
        field: text
      type:
        kind: Never
