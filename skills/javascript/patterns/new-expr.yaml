id: new-expr
language: javascript
match:
  nodeType: new_expression
  children:
    - pattern:
        nodeType: identifier
        capture: $CTOR
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $$$ARGS
            isSequence: true
emit:
  kind: OopNew
  ctorSymbolId:
    metavar: $CTOR
    field: text
  args: []
