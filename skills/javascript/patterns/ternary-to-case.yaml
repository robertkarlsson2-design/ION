id: ternary-to-case
language: javascript
match:
  nodeType: ternary_expression
  children:
    - pattern:
        capture: $COND
    - pattern:
        capture: $THEN
    - pattern:
        capture: $ELSE
emit:
  kind: Case
  scrutinee:
    kind: Var
    name:
      metavar: $COND
      field: text
    symbolId:
      metavar: $COND
      field: text
    type:
      kind: Never
  arms:
    - pattern:
        kind: Constructor
        ctorName: True
        symbolId: True
        args: []
        type:
          kind: Never
      body:
        kind: Var
        name:
          metavar: $THEN
          field: text
        symbolId:
          metavar: $THEN
          field: text
        type:
          kind: Never
    - pattern:
        kind: Constructor
        ctorName: False
        symbolId: False
        args: []
        type:
          kind: Never
      body:
        kind: Var
        name:
          metavar: $ELSE
          field: text
        symbolId:
          metavar: $ELSE
          field: text
        type:
          kind: Never
  type:
    kind: Never
