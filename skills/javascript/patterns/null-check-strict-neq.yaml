id: null-check-strict-neq
language: javascript
match:
  nodeType: binary_expression
  children:
    - pattern:
        capture: $LEFT
    - pattern:
        capture: $OP
    - pattern:
        nodeType: "null"
        capture: $RIGHT
conditions:
  - kind: text-equals
    var: $OP
    value: "!=="
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: isSome
    module: ion:option
    symbol: isSome
    sig:
      params: []
      ret:
        kind: Never
      template: "$1 !== null"
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LEFT
        field: text
      symbolId:
        metavar: $LEFT
        field: text
      type:
        kind: Never
