id: array-map
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
conditions:
  - kind: text-equals
    var: $METHOD
    value: "map"
emit:
  kind: App
  callee:
    kind: Accessor
    receiver:
      kind: Var
      name:
        metavar: $OBJ
        field: text
      symbolId:
        metavar: $OBJ
        field: text
      type:
        kind: Never
    member: map
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $FN
        field: text
      symbolId:
        metavar: $FN
        field: text
      type:
        kind: Never
