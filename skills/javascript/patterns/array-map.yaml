id: array-map
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
conditions:
  - kind: text-equals
    var: $METHOD
    value: "map"
emit:
  kind: App
  callee:
    kind: Accessor
    receiver:
      recurse: $OBJ
    member: map
    type:
      kind: Never
  args:
    - recurse: $FN
