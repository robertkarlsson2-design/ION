id: try-catch-finally
language: javascript
match:
  nodeType: try_statement
  children:
    - pattern:
        nodeType: statement_block
        capture: $BODY
    - pattern:
        nodeType: catch_clause
        capture: $CATCH
    - pattern:
        nodeType: finally_clause
        capture: $FINALLY
conditions:
  - kind: has-children
    count: 3
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: tryCatchFinally
    module: ion:result
    symbol: tryCatchFinally
    sig:
      params: []
      ret:
        kind: Never
      template: "try { $1() } catch(e) { $2(e) } finally { $3() }"
    type:
      kind: Never
  args:
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $BODY
          field: text
        symbolId:
          metavar: $BODY
          field: text
        type:
          kind: Never
      type:
        kind: Never
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $CATCH
          field: text
        symbolId:
          metavar: $CATCH
          field: text
        type:
          kind: Never
      type:
        kind: Never
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $FINALLY
          field: text
        symbolId:
          metavar: $FINALLY
          field: text
        type:
          kind: Never
      type:
        kind: Never
