id: array-find-option
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
conditions:
  - kind: text-equals
    var: $METHOD
    value: "find"
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: fromNullable
    module: ion:option
    symbol: fromNullable
    sig:
      params: []
      ret:
        kind: Never
      template: "$1"
    type:
      kind: Never
  args:
    - kind: App
      callee:
        kind: Accessor
        receiver:
          kind: Var
          name:
            metavar: $OBJ
            field: text
          symbolId:
            metavar: $OBJ
            field: text
          type:
            kind: Never
        member: find
        type:
          kind: Never
      args:
        - kind: Var
          name:
            metavar: $FN
            field: text
          symbolId:
            metavar: $FN
            field: text
          type:
            kind: Never
      type:
        kind: Never
