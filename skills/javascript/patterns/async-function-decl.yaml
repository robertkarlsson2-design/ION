id: async-function-decl
language: javascript
match:
  nodeType: function_declaration
  children:
    - pattern:
        capture: $ASYNC_KW
    - pattern:
        nodeType: identifier
        capture: $NAME
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: statement_block
        capture: $BODY
conditions:
  - kind: text-equals
    var: $ASYNC_KW
    value: "async"
emit:
  kind: Let
  name:
    metavar: $NAME
    field: text
  symbolId:
    metavar: $NAME
    field: text
  bindingType:
    kind: Never
  value:
    kind: AsyncBlock
    body:
      kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $BODY
          field: text
        symbolId:
          metavar: $BODY
          field: text
        type:
          kind: Never
      type:
        kind: Never
    type:
      kind: Never
  body:
    kind: Literal
    value:
      kind: Int
      value: 0
    type:
      kind: Int
