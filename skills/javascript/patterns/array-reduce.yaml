id: array-reduce
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              text: reduce
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
          - pattern:
              capture: $INIT
emit:
  kind: App
  callee:
    kind: Var
    name:
      metavar: $OBJ
      field: text
    symbolId:
      metavar: $OBJ
      field: text
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $FN
        field: text
      symbolId:
        metavar: $FN
        field: text
      type:
        kind: Never
  type:
    kind: Never
