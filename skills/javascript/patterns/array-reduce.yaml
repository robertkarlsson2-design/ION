id: array-reduce
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
          - pattern:
              capture: $INIT
conditions:
  - kind: text-equals
    var: $METHOD
    value: "reduce"
emit:
  kind: App
  callee:
    kind: Accessor
    receiver:
      recurse: $OBJ
    member: reduce
    type:
      kind: Never
  args:
    - recurse: $FN
    - recurse: $INIT
