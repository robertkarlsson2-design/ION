id: class-extends
language: javascript
match:
  nodeType: class_declaration
  children:
    - pattern:
        nodeType: identifier
        capture: $NAME
    - pattern:
        nodeType: class_heritage
        capture: $SUPER
    - pattern:
        nodeType: class_body
        capture: $BODY
conditions:
  - kind: has-children
    count: 3
emit:
  kind: OopClass
  name:
    metavar: $NAME
    field: text
  symbolId:
    metavar: $NAME
    field: text
  superClass:
    metavar: $SUPER
    field: text
  interfaces: []
  fields: []
  methods: []
