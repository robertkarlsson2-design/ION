        nodeType: variable_declarator
        children:
          - pattern:
              nodeType: array_pattern
              capture: $PATTERN
          - pattern:
              capture: $VALUE
conditions:
  - kind: has-children
    count: 1
emit:
  kind: Let
  name:
    metavar: $PATTERN
    field: text
  symbolId:
    metavar: $PATTERN
    field: text
  bindingType:
    kind: Never
  value:
    kind: Var
    name:
      metavar: $VALUE
      field: text
    symbolId:
      metavar: $VALUE
      field: text
    type:
      kind: Never
  body:
    kind: Literal
    value:
      kind: Int
      value: 0
    type:
      kind: Int
