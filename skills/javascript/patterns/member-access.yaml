id: member-access
language: javascript
match:
  nodeType: member_expression
  children:
    - pattern:
        capture: $OBJ
    - pattern:
        nodeType: property_identifier
        capture: $PROP
emit:
  kind: Accessor
  receiver:
    recurse: $OBJ
  member:
    metavar: $PROP
    field: text
  type:
    kind: Never
