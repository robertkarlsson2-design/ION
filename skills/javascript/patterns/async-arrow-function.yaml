id: async-arrow-function
language: javascript
match:
  nodeType: arrow_function
  children:
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: statement_block
        capture: $BODY
conditions:
  - kind: node-text-contains
    text: "async "
emit:
  kind: AsyncBlock
  body:
    kind: Abs
    params: []
    captures: []
    body:
      kind: Var
      name:
        metavar: $BODY
        field: text
      symbolId:
        metavar: $BODY
        field: text
      type:
        kind: Never
    type:
      kind: Never
  type:
    kind: Never
