id: arrow-function-block
language: javascript
match:
  nodeType: arrow_function
  children:
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: statement_block
        capture: $BODY
emit:
  kind: Abs
  params: []
  captures: []
  body:
    recurse: $BODY
  type:
    kind: Never
