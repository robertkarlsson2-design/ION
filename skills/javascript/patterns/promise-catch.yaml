id: promise-catch
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
conditions:
  - kind: text-equals
    var: $METHOD
    value: "catch"
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: catchErr
    module: ion:result
    symbol: catchErr
    sig:
      params: []
      ret:
        kind: Never
      template: "$1.catch($2)"
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $OBJ
        field: text
      symbolId:
        metavar: $OBJ
        field: text
      type:
        kind: Never
    - kind: Var
      name:
        metavar: $FN
        field: text
      symbolId:
        metavar: $FN
        field: text
      type:
        kind: Never
