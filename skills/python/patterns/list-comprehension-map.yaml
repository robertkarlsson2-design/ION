id: list-comprehension-map
language: python
# Matches: [f(x) for x in lst]
# Emits:   lst |> map(x -> f(x))
# Note: the comprehension has exactly one for_clause and no if_clause.
match:
  nodeType: list_comprehension
  children:
    - pattern:
        capture: $EXPR
    - pattern:
        nodeType: for_in_clause
        children:
          - pattern:
              nodeType: identifier
              capture: $VAR
          - pattern:
              capture: $LST
conditions:
  - kind: has-children
    count: 2
emit:
  kind: App
  callee:
    kind: Var
    name: map
    symbolId: map
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LST
        field: text
      symbolId:
        metavar: $LST
        field: text
      type:
        kind: Never
    - kind: Abs
      params:
        - name:
            metavar: $VAR
            field: text
          symbolId:
            metavar: $VAR
            field: text
          type:
            kind: Never
          span:
            metavar: $VAR
            field: span
      captures: []
      body:
        kind: Var
        name:
          metavar: $EXPR
          field: text
        symbolId:
          metavar: $EXPR
          field: text
        type:
          kind: Never
      type:
        kind: Never
