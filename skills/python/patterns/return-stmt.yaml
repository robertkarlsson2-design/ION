id: return-stmt
language: python
# Matches: return expr
# Emits:   the expression itself (return is implicit in Ion function bodies)
match:
  nodeType: return_statement
  children:
    - pattern:
        capture: $EXPR
emit:
  kind: Var
  name:
    metavar: $EXPR
    field: text
  symbolId:
    metavar: $EXPR
    field: text
  type:
    kind: Never
