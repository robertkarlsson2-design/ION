id: int-call
language: python
# Matches: int(expr)
# Emits:   toInt(expr)  — Ion prelude `toInt`
match:
  nodeType: call
  children:
    - pattern:
        nodeType: identifier
        capture: $FN
    - pattern:
        nodeType: argument_list
        children:
          - pattern:
              capture: $ARG
conditions:
  - kind: text-equals
    var: $FN
    value: "int"
  - kind: has-children
    count: 1
emit:
  kind: App
  callee:
    kind: Var
    name: toInt
    symbolId: toInt
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $ARG
        field: text
      symbolId:
        metavar: $ARG
        field: text
      type:
        kind: Never
