id: reduce-call
language: python
# Matches: functools.reduce(f, lst, init)
# Emits:   fold(lst, init, f)  — Ion prelude `fold`
match:
  nodeType: call
  children:
    - pattern:
        nodeType: attribute
        children:
          - pattern:
              nodeType: identifier
              capture: $MODULE
          - pattern:
              nodeType: identifier
              capture: $FN
    - pattern:
        nodeType: argument_list
        children:
          - pattern:
              capture: $F
          - pattern:
              capture: $LST
          - pattern:
              capture: $INIT
conditions:
  - kind: text-equals
    var: $MODULE
    value: "functools"
  - kind: text-equals
    var: $FN
    value: "reduce"
emit:
  kind: App
  callee:
    kind: Var
    name: fold
    symbolId: fold
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LST
        field: text
      symbolId:
        metavar: $LST
        field: text
      type:
        kind: Never
    - kind: Var
      name:
        metavar: $INIT
        field: text
      symbolId:
        metavar: $INIT
        field: text
      type:
        kind: Never
    - kind: Var
      name:
        metavar: $F
        field: text
      symbolId:
        metavar: $F
        field: text
      type:
        kind: Never
