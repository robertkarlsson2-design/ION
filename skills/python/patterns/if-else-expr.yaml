id: if-else-expr
language: python
# Matches: a if cond else b   (Python conditional_expression)
# Emits:   if cond then a else b
match:
  nodeType: conditional_expression
  children:
    - pattern:
        capture: $THEN
    - pattern:
        capture: $COND
    - pattern:
        capture: $ELSE
emit:
  kind: Case
  scrutinee:
    kind: Var
    name:
      metavar: $COND
      field: text
    symbolId:
      metavar: $COND
      field: text
    type:
      kind: Never
  arms:
    - pattern:
        kind: Literal
        value:
          kind: Bool
          value: true
      body:
        recurse: $THEN
    - pattern:
        kind: Wildcard
      body:
        recurse: $ELSE
  type:
    kind: Never
