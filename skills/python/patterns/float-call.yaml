id: float-call
language: python
# Matches: float(expr)
# Emits:   toFloat(expr)  — Ion prelude `toFloat`
match:
  nodeType: call
  children:
    - pattern:
        nodeType: identifier
        capture: $FN
    - pattern:
        nodeType: argument_list
        children:
          - pattern:
              capture: $ARG
conditions:
  - kind: text-equals
    var: $FN
    value: "float"
  - kind: has-children
    count: 1
emit:
  kind: App
  callee:
    kind: Var
    name: toFloat
    symbolId: toFloat
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $ARG
        field: text
      symbolId:
        metavar: $ARG
        field: text
      type:
        kind: Never
