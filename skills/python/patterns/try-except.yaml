id: try-except
language: python
# Matches: try: body except E as e: handler
# Emits:   Result-style App wrapping try/except as foreign call
# The body and handler are lifted into thunks so they can be called lazily.
match:
  nodeType: try_statement
  children:
    - pattern:
        nodeType: block
        capture: $BODY
    - pattern:
        nodeType: except_clause
        capture: $HANDLER
conditions:
  - kind: has-children
    count: 2
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: tryCatch
    module: ion:result
    symbol: tryCatch
    sig:
      params: []
      ret:
        kind: Never
      template: "(lambda: $1())()"
    type:
      kind: Never
  args:
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $BODY
          field: text
        symbolId:
          metavar: $BODY
          field: text
        type:
          kind: Never
      type:
        kind: Never
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $HANDLER
          field: text
        symbolId:
          metavar: $HANDLER
          field: text
        type:
          kind: Never
      type:
        kind: Never
