id: boolean-and
language: python
# Matches: a and b
# Emits:   a && b  (Ion __and__ binary op)
match:
  nodeType: boolean_operator
  children:
    - pattern:
        capture: $LEFT
    - pattern:
        nodeType: identifier
        capture: $OP
    - pattern:
        capture: $RIGHT
conditions:
  - kind: text-equals
    var: $OP
    value: "and"
emit:
  kind: App
  callee:
    kind: Var
    name: __and__
    symbolId: __and__
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LEFT
        field: text
      symbolId:
        metavar: $LEFT
        field: text
      type:
        kind: Never
    - kind: Var
      name:
        metavar: $RIGHT
        field: text
      symbolId:
        metavar: $RIGHT
        field: text
      type:
        kind: Never
