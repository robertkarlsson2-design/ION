id: promise-then-catch
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        capture: $CHAIN
    - pattern:
        nodeType: arguments
        capture: $ON_REJECTED
conditions:
  - kind: node-text-contains
    text: ".catch"
emit:
  kind: Await
  value:
    kind: Var
    name:
      metavar: $CHAIN
      field: text
    symbolId:
      metavar: $CHAIN
      field: text
    type:
      kind: Never
  type:
    kind: Never
