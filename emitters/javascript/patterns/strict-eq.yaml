id: strict-eq
language: javascript
# Matches: a === b  (strict equality binary expression)
# tree-sitter node: binary_expression with "===" operator
# Ion treatment: convert to prelude eq(a, b)
# Note: more specific patterns (null-check-strict-eq, undefined-check-strict-eq)
# take priority for === null / === undefined comparisons.
match:
  nodeType: binary_expression
  children:
    - pattern:
        capture: $LEFT
    - pattern:
        text: "==="
    - pattern:
        capture: $RIGHT
emit:
  kind: App
  callee:
    kind: Var
    name: eq
    symbolId: prelude:eq
    type:
      kind: Never
  args:
    - recurse: $LEFT
    - recurse: $RIGHT
  type:
    kind: Never
