id: method-call
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $$$ARGS
            isSequence: true
emit:
  kind: OopVirtualCall
  receiver:
    recurse: $OBJ
  method:
    metavar: $METHOD
    field: text
  args:
    recurse-each: $$$ARGS
