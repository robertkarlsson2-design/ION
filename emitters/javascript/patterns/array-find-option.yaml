id: array-find-option
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              nodeType: property_identifier
              capture: $METHOD
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $FN
conditions:
  - kind: text-equals
    var: $METHOD
    value: "find"
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: fromNullable
    module: ion:option
    symbol: fromNullable
    sig:
      params: []
      ret:
        kind: Never
      template: "$1"
    type:
      kind: Never
  args:
    - kind: App
      callee:
        kind: Accessor
        receiver:
          recurse: $OBJ
        member: find
        type:
          kind: Never
      args:
        - recurse: $FN
      type:
        kind: Never
