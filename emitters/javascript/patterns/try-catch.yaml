id: try-catch
language: javascript
match:
  nodeType: try_statement
  children:
    - pattern:
        nodeType: statement_block
        capture: $BODY
    - pattern:
        nodeType: catch_clause
        capture: $CATCH
conditions:
  - kind: has-children
    count: 2
emit:
  kind: App
  callee:
    kind: ForeignRef
    target: tryCatch
    module: ion:result
    symbol: tryCatch
    sig:
      params: []
      ret:
        kind: Never
      template: "try { $1() } catch(e) { $2(e) }"
    type:
      kind: Never
  args:
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $BODY
          field: text
        symbolId:
          metavar: $BODY
          field: text
        type:
          kind: Never
      type:
        kind: Never
    - kind: Abs
      params: []
      captures: []
      body:
        kind: Var
        name:
          metavar: $CATCH
          field: text
        symbolId:
          metavar: $CATCH
          field: text
        type:
          kind: Never
      type:
        kind: Never
