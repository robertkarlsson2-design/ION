id: array-find-to-option
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        capture: $CALLEE
    - pattern:
        nodeType: arguments
        capture: $ARGS
conditions:
  - kind: node-text-contains
    text: ".find"
emit:
  kind: App
  callee:
    recurse: $CALLEE
  args:
    - recurse: $ARGS
  type:
    kind: Never
