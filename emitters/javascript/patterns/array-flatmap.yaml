id: array-flatmap
language: javascript
match:
  nodeType: call_expression
  children:
    - pattern:
        nodeType: member_expression
        children:
          - pattern:
              capture: $OBJ
          - pattern:
              text: flatMap
    - pattern:
        nodeType: arguments
        children:
          - pattern:
              capture: $ARG
emit:
  kind: App
  callee:
    recurse: $OBJ
  args:
    - recurse: $ARG
  type:
    kind: Never
