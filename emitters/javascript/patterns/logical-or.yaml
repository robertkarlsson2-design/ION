id: logical-or
language: javascript
# Matches: a || b  (logical OR binary expression)
# tree-sitter node: binary_expression with "||" operator
# Ion treatment: convert to prelude or(a, b)
match:
  nodeType: binary_expression
  children:
    - pattern:
        capture: $LEFT
    - pattern:
        text: "||"
    - pattern:
        capture: $RIGHT
emit:
  kind: App
  callee:
    kind: Var
    name: or
    symbolId: prelude:or
    type:
      kind: Never
  args:
    - recurse: $LEFT
    - recurse: $RIGHT
  type:
    kind: Never
