id: if-else
language: javascript
match:
  nodeType: if_statement
  children:
    - pattern:
        capture: $COND
    - pattern:
        nodeType: statement_block
        capture: $THEN
    - pattern:
        nodeType: else_clause
        capture: $ELSE
emit:
  kind: Case
  scrutinee:
    recurse: $COND
  arms:
    - pattern:
        kind: Constructor
        ctorName: "True"
        symbolId: builtin:True
        fields: []
      body:
        recurse: $THEN
    - pattern:
        kind: Wildcard
      body:
        recurse: $ELSE
  type:
    kind: Never
