id: list-comprehension-filter
language: python
# Matches: [x for x in lst if pred(x)]
# Emits:   lst |> filter(x -> pred(x))
# Note: comprehension has a for_clause followed by an if_clause, and
# the expression is the same identifier as the loop variable.
match:
  nodeType: list_comprehension
  children:
    - pattern:
        nodeType: identifier
        capture: $VAR
    - pattern:
        nodeType: for_in_clause
        children:
          - pattern:
              nodeType: identifier
              capture: $VAR2
          - pattern:
              capture: $LST
    - pattern:
        nodeType: if_clause
        children:
          - pattern:
              capture: $PRED
conditions:
  - kind: text-equals
    var: $VAR
    value:
      metavar: $VAR2
      field: text
emit:
  kind: App
  callee:
    kind: Var
    name: filter
    symbolId: filter
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LST
        field: text
      symbolId:
        metavar: $LST
        field: text
      type:
        kind: Never
    - kind: Abs
      params:
        - name:
            metavar: $VAR
            field: text
          symbolId:
            metavar: $VAR
            field: text
          type:
            kind: Never
          span:
            metavar: $VAR
            field: span
      captures: []
      body:
        recurse: $PRED
      type:
        kind: Never
