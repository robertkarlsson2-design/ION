id: sorted-call
language: python
# Matches: sorted(lst)
# Emits:   sort(lst)  — Ion prelude `sort` maps to Python `sorted(lst)`
match:
  nodeType: call
  children:
    - pattern:
        nodeType: identifier
        capture: $FN
    - pattern:
        nodeType: argument_list
        children:
          - pattern:
              capture: $LST
conditions:
  - kind: text-equals
    var: $FN
    value: "sorted"
  - kind: has-children
    count: 1
emit:
  kind: App
  callee:
    kind: Var
    name: sort
    symbolId: sort
    type:
      kind: Never
  args:
    - kind: Var
      name:
        metavar: $LST
        field: text
      symbolId:
        metavar: $LST
        field: text
      type:
        kind: Never
