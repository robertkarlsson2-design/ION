id: as-cast
language: typescript
# Matches: expr as SomeType  (TypeScript type assertion)
# tree-sitter-typescript node: as_expression
# Children: <expression> + as + <type>
# Ion treatment: drop the cast entirely — emit only the inner expression.
# Ion has no cast syntax; casts are erased during ingestion and the inner
# value is used directly. The emitter will annotate based on inferred types.
match:
  nodeType: as_expression
  children:
    - pattern:
        capture: $EXPR
    - pattern:
        capture: $TYPE
conditions:
  - kind: has-children
    count: 2
emit:
  recurse: $EXPR
