id: async-typed-fn
language: typescript
# Matches: async (x: string): Promise<number> => expr
# tree-sitter-typescript: arrow_function that is async, with typed formal_parameters
# and a type_annotation return type (Promise<T>).
# The Promise<T> return annotation is stripped during ingestion — Ion's !async
# effect already encodes the async nature; the inner type T is used as the
# Ion return type.
match:
  nodeType: arrow_function
  children:
    - pattern:
        nodeType: formal_parameters
        capture: $PARAMS
    - pattern:
        nodeType: type_annotation
        capture: $RETURN_TYPE
    - pattern:
        capture: $BODY
conditions:
  - kind: node-text-contains
    text: "async "
  - kind: has-child
    nodeType: type_annotation
emit:
  kind: AsyncBlock
  body:
    kind: Abs
    params: []
    captures: []
    body:
      recurse: $BODY
    type:
      kind: Never
  type:
    kind: Never
