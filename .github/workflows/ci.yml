name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + typecheck + build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ion uses fs.promises.glob (Node 22+) in the CLI's --all paths.
        # If engines is broadened later, add Node 20 back.
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (src + tests)
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Token-count benchmark (sanity check)
        run: pnpm run bench:tokens

      - name: Verify CLI runs
        run: |
          output=$(node dist/src/cli/ion.js 2>&1 || true)
          echo "$output" | grep -q "usage: ion"

      - name: Verify npm pack
        run: npm pack --dry-run
